[project]
name = "Constrained_Decoding"
version = "0.1.0"
description = "Function-calling pipeline for the 42 Constrained_Decoding project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pydantic>=2.0.0",
  "llm-sdk",
  "torch>=2.0.0",
  "accelerate>=1.0.0",
  "transformers>=4.40.0",
  "huggingface-hub>=0.20.0",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
